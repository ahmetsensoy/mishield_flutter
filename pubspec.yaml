name: mishield_flutter
description: MiShield — Flutter DNS-only client (no API/Firebase). Remote JSON for DNS + mandatory updates; optional AdMob.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.20.2
  http: ^1.2.2
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.1
  google_mobile_ads: ^5.3.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
